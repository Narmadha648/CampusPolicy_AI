version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    container_name: campuspolicy_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-campuspolicy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-campuspolicypass}
      POSTGRES_DB: ${POSTGRES_DB:-campuspolicy}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-campuspolicy}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
